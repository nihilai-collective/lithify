[workspace]
resolver = "2"
members = ["lithify", "auditor"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cycle-five/lithify"
authors = ["Cycle Five <cycle.five@proton.me>"]

[workspace.dependencies]
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
